<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Agent Sandbox Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #e0e0e0; font-family: 'JetBrains Mono', monospace;
            display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh;
        }
        h1 { color: #e94560; margin-bottom: 16px; font-size: 1.4rem; letter-spacing: 2px; }

        #canvas-wrapper { position: relative; margin-bottom: 16px; }
        canvas { border: 2px solid #0f3460; border-radius: 8px; background: #16213e; }

        #controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer;
            font-family: inherit; transition: all 0.2s; font-weight: 600; letter-spacing: 1px;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.2); }
        button:active { transform: translateY(0); }

        #btn-step { background: #e94560; color: #fff; }
        #btn-auto { background: #0f3460; color: #e0e0e0; }
        #btn-auto.running { background: #e94560; }
        #btn-reset { background: #333; color: #e0e0e0; }

        #info-bar { display: flex; gap: 24px; font-size: 0.9rem; color: #a0a0b0; margin-bottom: 12px; }
        .info-item { background: #0f3460; padding: 6px 14px; border-radius: 20px; }
        .info-value { color: #e94560; font-weight: bold; }

        #agent-list {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px;
        }
        .agent-card {
            background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 10px 16px;
            font-size: 0.8rem; min-width: 140px;
        }
        .agent-card .name { color: #e94560; font-weight: bold; font-size: 0.95rem; }
        .agent-card .pos { color: #a0a0b0; margin-top: 4px; }
    </style>
</head>
<body>
<h1>⚙️ Agent Sandbox</h1>

<div id="canvas-wrapper">
    <canvas id="world" width="600" height="400"></canvas>
</div>

<div id="controls">
    <button id="btn-step" onclick="step()">▶ 单步 Tick</button>
    <button id="btn-auto" onclick="toggleAuto()">⏱ 自动运行</button>
    <button id="btn-reset" onclick="reset()">↺ 重置</button>
</div>

<div id="info-bar">
    <span class="info-item">Tick: <span class="info-value" id="tick-display">0</span></span>
    <span class="info-item">Agents: <span class="info-value" id="agent-count">0</span></span>
    <span class="info-item">FPS: <span class="info-value" id="fps-display">0</span></span>
</div>

<div id="agent-list"></div>

<script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // ===== 世界参数（根据你的后端调整） =====
    const WORLD_WIDTH = 37;   // 网格列数
    const WORLD_HEIGHT = 37;  // 网格行数
    const CELL_SIZE = 20;     // 像素/格
    canvas.width = WORLD_WIDTH * CELL_SIZE;
    canvas.height = WORLD_HEIGHT * CELL_SIZE;

    let autoRunning = false;
    let autoInterval = null;
    const AUTO_INTERVAL_MS = 500; // 自动时每500ms走一个Tick

    // ===== 核心：从后端拉数据并渲染 =====
    async function fetchState() {
        const res = await fetch('/state');
        return await res.json();
    }

    async function step() {
        const res = await fetch('/step');
        const data = await res.json();
        render(data);
    }

    async function refreshState() {
        const data = await fetchState();
        render(data);
    }

    // ===== 渲染 =====
    function render(data) {
        // 更新数字
        document.getElementById('tick-display').textContent = data.tick;
        document.getElementById('agent-count').textContent = data.agents.length;

        // 清画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        // 画Agent
        const colors = ['#e94560', '#0f3460', '#51cf66', '#f0a500', '#339af0', '#cc5de8'];
        data.agents.forEach((agent, i) => {
            const color = colors[i % colors.length];
            const px = agent.x * CELL_SIZE + CELL_SIZE / 2;
            const py = agent.y * CELL_SIZE + CELL_SIZE / 2;

            // 光晕
            ctx.beginPath();
            ctx.arc(px, py, 10, 0, Math.PI * 2);
            ctx.fillStyle = color + '33';
            ctx.fill();

            // 主体圆点
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 名字
            ctx.fillStyle = '#fff';
            ctx.font = '9px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(agent.name, px, py - 12);
        });

        // 更新Agent卡片列表
        updateAgentCards(data.agents);
    }

    function drawGrid() {
        ctx.strokeStyle = '#0f3460';
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= WORLD_WIDTH; x++) {
            ctx.beginPath();
            ctx.moveTo(x * CELL_SIZE, 0);
            ctx.lineTo(x * CELL_SIZE, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= WORLD_HEIGHT; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * CELL_SIZE);
            ctx.lineTo(canvas.width, y * CELL_SIZE);
            ctx.stroke();
        }
    }

    function updateAgentCards(agents) {
        const container = document.getElementById('agent-list');
        container.innerHTML = agents.map(a => `
                <div class="agent-card">
                    <div class="name">${a.name}</div>
                    <div class="pos">📍 (${a.x}, ${a.y})</div>
                    <div class="pos">🆔 ${a.id}</div>
                </div>
            `).join('');
    }

    // ===== 控制按钮 =====
    function toggleAuto() {
        const btn = document.getElementById('btn-auto');
        if (autoRunning) {
            clearInterval(autoInterval);
            btn.textContent = '⏱ 自动运行';
            btn.classList.remove('running');
            autoRunning = false;
        } else {
            autoInterval = setInterval(step, AUTO_INTERVAL_MS);
            btn.textContent = '⏸ 停止自动';
            btn.classList.add('running');
            autoRunning = true;
        }
    }

    async function reset() {
        // 需要你在后端实现 /reset 接口
        await fetch('/reset', { method: 'POST' });
        refreshState();
    }

    // ===== 键盘快捷键 =====
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            step();
        } else if (e.code === 'KeyA') {
            toggleAuto();
        }
    });

    // ===== 初始加载 =====
    refreshState();
    drawGrid();

    // FPS 计数器（简易）
    let lastTime = performance.now();
    let frameCount = 0;
    setInterval(() => {
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
            document.getElementById('fps-display').textContent = frameCount;
            frameCount = 0;
            lastTime = now;
        }
    }, 1000);
</script>
</body>
</html>
